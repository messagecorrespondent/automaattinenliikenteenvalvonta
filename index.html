<!DOCTYPE html>
<html>
<head>
    <title>Traffic Camera</title>
</head>
<body>

<video id="video" autoplay playsinline style="width:100%;"></video>
<canvas id="canvas" style="display:none;"></canvas>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAgfRCiyw7ZfIh54c2MBD8ZxcKoj6E9apE",
  authDomain: "automaattinenvalvonta.firebaseapp.com",
  projectId: "automaattinenvalvonta",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// kamera
navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" }
}).then(stream => {
    video.srcObject = stream;
});

// lähetys
setInterval(() => {
    if (!video.videoWidth) return;

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video, 0, 0);

    const dataUrl = canvas.toDataURL("image/jpeg", 0.5); // pienempi koko

    addDoc(collection(db, "frames"), {
        image: dataUrl,
        timestamp: serverTimestamp(),
        deviceId: "cam1"
    });

}, 1000);
</script>

</body>
</html>
